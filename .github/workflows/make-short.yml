name: make-short
on:
  workflow_dispatch:
    inputs:
      resume:
        description: "ใช้บทและภาพเดิมจากรอบที่ล้มล่าสุด (ไม่เรียก Gemini เขียนบทใหม่) ติ๊กเฉพาะหลังรอบที่ล้มที่ขั้นภาพ"
        type: boolean
        default: false
  # เปิด schedule หลังทดสอบจริงผ่าน 3–5 รอบเท่านั้น
  # schedule:
  #   - cron: "0 0 * * *"
  #   - cron: "0 11 * * *"
permissions:
  contents: write
concurrency:
  group: make-short-${{ github.ref }}
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ติดตั้ง FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: ติดตั้ง Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: ตรวจไฟล์และทดสอบก่อนเริ่ม (ไม่เรียก Gemini)
        run: |
          set -euo pipefail
          test -f generate.py
          test -f test_pipeline.py
          python -m py_compile generate.py test_pipeline.py
          python -m unittest -v test_pipeline.py
          command -v ffmpeg
          command -v ffprobe
      - name: ดึงชื่อคลิปเก่า
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > past_titles.txt
          if gh release list --limit 200 --json name --jq '.[].name' > past_titles.txt; then
            echo "ดึงชื่อคลิปเก่าได้ $(wc -l < past_titles.txt) รายการ"
          else
            : > past_titles.txt
            echo "::warning::ดึงชื่อคลิปเก่าไม่สำเร็จ ระบบกันหัวข้อซ้ำจะไม่ทำงานรอบนี้"
          fi
      - name: กู้ checkpoint (เฉพาะเมื่อติ๊ก resume)
        if: ${{ inputs.resume }}
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint.json
            work/img*.jpg
            work/img*.jpg.ok
          key: checkpoint-restore
          restore-keys: checkpoint-
      - name: สร้างคลิป
        env:
          RESUME: ${{ inputs.resume && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NICHE: ${{ vars.NICHE }}
          VOICE_NAME: ${{ vars.VOICE_NAME }}
          CROP_BOTTOM: ${{ vars.CROP_BOTTOM }}
        run: python generate.py
      - name: ตรวจไฟล์ก่อนเผยแพร่
        shell: bash
        run: |
          set -euo pipefail
          test -s output.mp4
          test -s title.txt
          test -s notes.md
          ffprobe -v error output.mp4
          python - <<'PY'
          import json, subprocess
          p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height,r_frame_rate","-of","json","output.mp4"],capture_output=True,text=True,check=True)
          streams=json.loads(p.stdout)["streams"]
          v=[x for x in streams if x["codec_type"]=="video"]
          a=[x for x in streams if x["codec_type"]=="audio"]
          assert v and a, "ต้องมีทั้งภาพและเสียง"
          assert (v[0]["width"],v[0]["height"],v[0]["r_frame_rate"])==(1080,1920,"30/1"), v[0]
          print("Release QC passed")
          PY
      - name: เผยแพร่ Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "clip-${GITHUB_RUN_ID}" output.mp4 --draft --title "$(cat title.txt)" --notes-file notes.md
      - name: บันทึก checkpoint เมื่อล้ม (ไว้ resume)
        if: ${{ failure() && hashFiles('checkpoint.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint.json
            work/img*.jpg
            work/img*.jpg.ok
          key: checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: เก็บ diagnostics เมื่อเกิดข้อผิดพลาด
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: make-short-diagnostics-${{ github.run_id }}
          path: |
            work/
            title.txt
            notes.md
            output.mp4
          if-no-files-found: ignore
          retention-days: 7
